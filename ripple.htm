<title>Ripple Effect</title>
</head>
<body>
<section style="max-height: auto; width:1920px; margin: auto;">
  <div id="ripple" style="height: 1080px;
     background: url('https://i.imgur.com/nohbNjO.jpg') ; background-size: cover;
  background: 100;
  ">
  </div>
</section>


<script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js'></script>

<script  src="./script.js"></script>

<script>
    $('#ripple').ripples({
	resolution: 512,
	dropRadius: 20,
	perturbance: 0.04,
});

</script>
